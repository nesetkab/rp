name: build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag
        required: true
        default: v1.0.0

permissions:
  contents: write

env:
  VERSION_ARG: ${{ inputs.tag && format('VERSION={0}', inputs.tag) || '' }}

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: rp-linux-x86_64
          - runner: ubuntu-24.04-arm
            asset: rp-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev nlohmann-json3-dev
      - name: build (static)
        run: make STATIC=1 $VERSION_ARG && strip rp
      - name: smoke test
        run: ./rp --version && ./rp --help
      - name: package
        run: tar -czf ${{ matrix.asset }}.tar.gz rp README.md config.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz

  macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install dependencies
        run: brew install nlohmann-json
      - name: build arm64
        run: make $VERSION_ARG BUILD=build/arm64 TARGET=rp-arm64 CXXFLAGS="-std=c++17 -Wall -Wextra -O2 -arch arm64" LDFLAGS="-arch arm64"
      - name: build x86_64
        run: make $VERSION_ARG BUILD=build/x86_64 TARGET=rp-x86_64 CXXFLAGS="-std=c++17 -Wall -Wextra -O2 -arch x86_64" LDFLAGS="-arch x86_64"
      - name: make universal binary
        run: lipo -create -output rp rp-arm64 rp-x86_64 && strip rp && lipo -info rp
      - name: smoke test
        run: ./rp --version && ./rp --help
      - name: package
        run: tar -czf rp-macos-universal.tar.gz rp README.md config.json
      - uses: actions/upload-artifact@v4
        with:
          name: rp-macos-universal
          path: rp-macos-universal.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: rp ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.tar.gz
            install.sh
          body: |
            ## try it (no pico needed)

            ```sh
            curl -fsSL https://github.com/nesetkab/rp/releases/latest/download/install.sh | sh
            ~/.local/bin/rp --demo
            ```

            `--demo` runs rp w a fake pico so u can mess w everything without hardware. `r` run, `s` stop, `d` deploy, `e` edit, `u` unplug, `p` repl, `q` quit

            ## or download manually

            | system | file |
            | --- | --- |
            | mac (m1+ and intel) | `rp-macos-universal.tar.gz` |
            | linux x86_64 | `rp-linux-x86_64.tar.gz` |
            | linux arm64 (pi 4/5) | `rp-linux-arm64.tar.gz` |
            | windows | use wsl + the linux one |

            ```sh
            tar -xzf rp-*.tar.gz
            ./rp --demo
            ```

            on mac if u downloaded it in a browser and it wont open, run `xattr -d com.apple.quarantine rp` (or just use the curl thing)
